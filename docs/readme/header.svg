<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Remere's Map Editor: Redux — Dungeon Forged</title>
<desc id="desc">RPG dungeon header — stone, torchlight, C++23 · OpenGL 4.6</desc>
<defs>
  <!-- stone wall base -->
  <linearGradient id="stoneBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1E2226"/>
    <stop offset="100%" stop-color="#0E1114"/>
  </linearGradient>
  <!-- mortar + brick pattern -->
  <pattern id="brick" width="72" height="36" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)">
    <rect width="72" height="36" fill="#2A2E33"/>
    <!-- horizontal mortar -->
    <rect y="0" width="72" height="2" fill="#15181B"/>
    <rect y="34" width="72" height="2" fill="#15181B"/>
    <!-- vertical mortar + bricks -->
    <rect x="0" y="2" width="2" height="32" fill="#15181B"/>
    <rect x="35" y="2" width="2" height="16" fill="#1A1E22"/>
    <rect x="70" y="2" width="2" height="32" fill="#15181B"/>
    <!-- brick face highlight -->
    <rect x="2" y="2" width="33" height="8" fill="#32373D" opacity="0.35"/>
    <rect x="37" y="18" width="33" height="6" fill="#32373D" opacity="0.22"/>
    <!-- cracks -->
    <path d="M12 10 l3 5 l-2 4" stroke="#1A1E22" stroke-width="0.9" opacity="0.5" fill="none"/>
    <path d="M52 22 l4 3" stroke="#1A1E22" stroke-width="0.8" opacity="0.45" fill="none"/>
  </pattern>
  <!-- staggered second row -->
  <pattern id="brick2" width="72" height="36" patternUnits="userSpaceOnUse" patternTransform="translate(36 18)">
    <rect width="72" height="36" fill="#2F3338"/>
    <rect y="0" width="72" height="2" fill="#15181B"/>
    <rect y="34" width="72" height="2" fill="#15181B"/>
    <rect x="0" y="2" width="2" height="32" fill="#15181B"/>
    <rect x="35" y="2" width="2" height="16" fill="#1A1E22"/>
    <rect x="70" y="2" width="2" height="32" fill="#15181B"/>
    <rect x="2" y="2" width="33" height="7" fill="#3A3F45" opacity="0.28"/>
  </pattern>
  <!-- dungeon floor tiles -->
  <pattern id="floor" width="64" height="64" patternUnits="userSpaceOnUse">
    <rect width="64" height="64" fill="#1A1D1F"/>
    <rect x="1" y="1" width="30" height="30" rx="2" fill="#2B2F33" stroke="#15181B" stroke-width="1.4"/>
    <rect x="33" y="1" width="30" height="30" rx="2" fill="#262A2E" stroke="#15181B" stroke-width="1.4"/>
    <rect x="1" y="33" width="30" height="30" rx="2" fill="#262A2E" stroke="#15181B" stroke-width="1.4"/>
    <rect x="33" y="33" width="30" height="30" rx="2" fill="#2B2F33" stroke="#15181B" stroke-width="1.4"/>
    <circle cx="16" cy="16" r="1.1" fill="#3A3F45" opacity="0.5"/>
    <circle cx="48" cy="48" r="1" fill="#3A3F45" opacity="0.4"/>
  </pattern>
  <!-- flame gradient -->
  <radialGradient id="flame" cx="50%" cy="38%" r="58%">
    <stop offset="0%" stop-color="#FFF2A8"/>
    <stop offset="28%" stop-color="#FFB62E"/>
    <stop offset="62%" stop-color="#FF6B2B"/>
    <stop offset="100%" stop-color="#7A1F0A" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF8A2B" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#FF6B2B" stop-opacity="0"/>
  </radialGradient>
  <!-- title engraved gradient -->
  <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F5E6C8"/>
    <stop offset="48%" stop-color="#D8C39A"/>
    <stop offset="100%" stop-color="#9C8A6A"/>
  </linearGradient>
  <filter id="carve">
    <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity="0.85"/>
    <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#000" flood-opacity="0.6"/>
  </filter>
  <filter id="torchGlow">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feColorMatrix type="matrix" values="1 0.6 0.2 0 0  0.6 0.3 0 0 0  0.2 0 0 0 0  0 0 0 0.65 0"/>
  </filter>
</defs>

<!-- base -->
<rect width="1200" height="280" rx="16" fill="url(#stoneBg)"/>
<!-- wall bricks top -->
<rect y="0" width="1200" height="118" rx="16" fill="url(#brick)" opacity="0.95"/>
<rect y="0" width="1200" height="118" rx="16" fill="url(#brick2)" opacity="0.42"/>
<!-- vignette top -->
<rect y="0" width="1200" height="118" rx="16" fill="none" stroke="#0A0C0E" stroke-width="0" />
<!-- darkening overlay for depth -->
<rect y="0" width="1200" height="118" rx="16" fill="black" opacity="0.18"/>

<!-- floor -->
<rect y="186" width="1200" height="94" rx="0" fill="url(#floor)" opacity="0.95"/>
<rect y="186" width="1200" height="1.5" fill="#FF8A2B" opacity="0.18"/>
<!-- floor ambient occlusion -->
<rect y="176" width="1200" height="16" fill="url(#stoneBg)" opacity="0.55"/>

<!-- top iron bar -->
<g>
  <rect y="116" width="1200" height="10" fill="#1A1E22"/>
  <rect y="116" width="1200" height="2" fill="#2F353B"/>
  <rect y="124" width="1200" height="2" fill="#0E1012"/>
  <!-- rivets along bar -->
  <g fill="#3A424A" stroke="#0E1012" stroke-width="1">
    <circle cx="80" cy="121" r="4.2"/><circle cx="80" cy="121" r="1.6" fill="#6B7280"/>
    <circle cx="220" cy="121" r="4.2"/><circle cx="220" cy="121" r="1.6" fill="#6B7280"/>
    <circle cx="360" cy="121" r="4.2"/><circle cx="360" cy="121" r="1.6" fill="#6B7280"/>
    <circle cx="600" cy="121" r="4.2"/><circle cx="600" cy="121" r="1.6" fill="#6B7280"/>
    <circle cx="840" cy="121" r="4.2"/><circle cx="840" cy="121" r="1.6" fill="#6B7280"/>
    <circle cx="980" cy="121" r="4.2"/><circle cx="980" cy="121" r="1.6" fill="#6B7280"/>
    <circle cx="1120" cy="121" r="4.2"/><circle cx="1120" cy="121" r="1.6" fill="#6B7280"/>
  </g>
</g>

<!-- LEFT TORCH -->
<g transform="translate(108,38)">
  <!-- glow behind -->
  <ellipse cx="22" cy="48" rx="54" ry="54" fill="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="0.42s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="22" cy="48" rx="38" ry="38" fill="url(#glow)" opacity="0.45">
    <animate attributeName="rx" values="38;42;38" dur="0.38s" repeatCount="indefinite"/>
  </ellipse>
  <!-- bracket -->
  <rect x="10" y="68" width="24" height="8" rx="2" fill="#2F353B" stroke="#0E1012" stroke-width="1.2"/>
  <rect x="14" y="76" width="16" height="18" rx="1.5" fill="#1E2226" stroke="#0E1012" stroke-width="1.1"/>
  <rect x="12" y="92" width="20" height="4" rx="1" fill="#3A424A"/>
  <!-- cup -->
  <path d="M 6 66 L 38 66 L 34 74 L 10 74 Z" fill="#2B3036" stroke="#0E1012" stroke-width="1.2"/>
  <!-- flame -->
  <g>
    <path d="M 22 68 C 16 54, 10 42, 22 18 C 34 42, 28 54, 22 68 Z" fill="url(#flame)">
      <animate attributeName="d" values="M 22 68 C 16 54, 10 42, 22 18 C 34 42, 28 54, 22 68 Z;M 22 68 C 14 53, 9 40, 22 16 C 36 40, 30 53, 22 68 Z;M 22 68 C 16 54, 10 42, 22 18 C 34 42, 28 54, 22 68 Z" dur="0.34s" repeatCount="indefinite"/>
    </path>
    <path d="M 22 68 C 18 58, 15 52, 22 30 C 29 52, 26 58, 22 68 Z" fill="#FFF2A8" opacity="0.92">
      <animate attributeName="opacity" values="0.92;0.78;0.92" dur="0.18s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- chain -->
  <rect x="20.5" y="0" width="3" height="66" fill="none" stroke="#3A424A" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.9"/>
  <circle cx="22" cy="6" r="3.5" fill="none" stroke="#3A424A" stroke-width="1.4"/>
  <circle cx="22" cy="14" r="3.5" fill="none" stroke="#3A424A" stroke-width="1.4"/>
  <circle cx="22" cy="22" r="3.5" fill="none" stroke="#3A424A" stroke-width="1.4"/>
</g>

<!-- RIGHT TORCH (mirrored) -->
<g transform="translate(1068,38)">
  <ellipse cx="22" cy="48" rx="54" ry="54" fill="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.58;0.9" dur="0.45s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="22" cy="48" rx="38" ry="38" fill="url(#glow)" opacity="0.45">
    <animate attributeName="rx" values="38;43;38" dur="0.4s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="10" y="68" width="24" height="8" rx="2" fill="#2F353B" stroke="#0E1012" stroke-width="1.2"/>
  <rect x="14" y="76" width="16" height="18" rx="1.5" fill="#1E2226" stroke="#0E1012" stroke-width="1.1"/>
  <rect x="12" y="92" width="20" height="4" rx="1" fill="#3A424A"/>
  <path d="M 6 66 L 38 66 L 34 74 L 10 74 Z" fill="#2B3036" stroke="#0E1012" stroke-width="1.2"/>
  <g>
    <path d="M 22 68 C 16 54, 10 42, 22 18 C 34 42, 28 54, 22 68 Z" fill="url(#flame)">
      <animate attributeName="d" values="M 22 68 C 16 54, 10 42, 22 18 C 34 42, 28 54, 22 68 Z;M 22 68 C 15 53, 8 41, 22 15 C 35 41, 29 53, 22 68 Z;M 22 68 C 16 54, 10 42, 22 18 C 34 42, 28 54, 22 68 Z" dur="0.36s" repeatCount="indefinite"/>
    </path>
    <path d="M 22 68 C 18 58, 15 52, 22 30 C 29 52, 26 58, 22 68 Z" fill="#FFF2A8" opacity="0.92">
      <animate attributeName="opacity" values="0.92;0.8;0.92" dur="0.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="20.5" y="0" width="3" height="66" fill="none" stroke="#3A424A" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.9"/>
  <circle cx="22" cy="6" r="3.5" fill="none" stroke="#3A424A" stroke-width="1.4"/>
  <circle cx="22" cy="14" r="3.5" fill="none" stroke="#3A424A" stroke-width="1.4"/>
  <circle cx="22" cy="22" r="3.5" fill="none" stroke="#3A424A" stroke-width="1.4"/>
</g>

<!-- central arch frame for title -->
<g opacity="0.95">
  <!-- arch background dark stone -->
  <path d="M 210 132 L 210 76 Q 600 -6 990 76 L 990 132 Z" fill="#0E1114" stroke="#2B3036" stroke-width="2.2"/>
  <path d="M 224 132 L 224 82 Q 600 14 976 82 L 976 132 Z" fill="none" stroke="#3A424A" stroke-width="1.1" opacity="0.6"/>
  <!-- keystone -->
  <rect x="588" y="8" width="24" height="26" rx="2" fill="#2F353B" stroke="#0E1012" stroke-width="1.2"/>
  <text x="600" y="25" text-anchor="middle" font-family="serif" font-size="13" fill="#C2B69B">◆</text>
</g>

<!-- TITLE — engraved dungeon serif -->
<g filter="url(#carve)">
  <text x="600" y="86" text-anchor="middle" font-family="Cinzel, Trajan Pro, serif" font-size="38" font-weight="800" letter-spacing="1.2" fill="url(#titleGrad)">Remere's Map Editor</text>
  <text x="600" y="114" text-anchor="middle" font-family="Cinzel, Trajan Pro, serif" font-size="20" font-weight="700" letter-spacing="8" fill="#FFB62E" opacity="0.98">✦ REDUX ✦</text>
</g>
<!-- title torch flicker overlay -->
<text x="600" y="86" text-anchor="middle" font-family="Cinzel, Trajan Pro, serif" font-size="38" font-weight="800" letter-spacing="1.2" fill="#FFB62E" opacity="0.08">
  Remere's Map Editor
  <animate attributeName="opacity" values="0.08;0.14;0.08" dur="0.55s" repeatCount="indefinite"/>
</text>

<!-- subtitle on scroll-ish plaque -->
<g transform="translate(600,132)">
  <rect x="-278" y="0" width="556" height="24" rx="4" fill="#1A1E22" stroke="#3A424A" stroke-width="1.2"/>
  <rect x="-278" y="0" width="556" height="24" rx="4" fill="none" stroke="#0E1012" stroke-width="0.6" opacity="0.5"/>
  <!-- rivets on plaque -->
  <circle cx="-270" cy="12" r="2.2" fill="#5A6570" stroke="#0E1012" stroke-width="0.9"/>
  <circle cx="270" cy="12" r="2.2" fill="#5A6570" stroke="#0E1012" stroke-width="0.9"/>
  <text y="16.2" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.2" font-weight="700" letter-spacing="2.6" fill="#9AA4B2">OPENGL 4.6  ·  C++23  ·  WXWIDGETS 3.3  ·  NANOVG  ·  SOL2 / LUA</text>
</g>

<!-- tagline parchment -->
<g transform="translate(600,164)">
  <rect x="-228" y="0" width="456" height="18" rx="9" fill="#0E1114" stroke="#2B3036" stroke-width="1.1" opacity="0.92"/>
  <text y="12.5" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#C2B69B" letter-spacing="0.4" font-style="italic">Modernized fork of the OT community's gold-standard map editor</text>
</g>

<!-- version plaque — iron + brass -->
<g transform="translate(600,198)">
  <rect x="-148" y="0" width="296" height="30" rx="6" fill="#1E2226" stroke="#3A424A" stroke-width="1.6"/>
  <rect x="-148" y="0" width="296" height="30" rx="6" fill="none" stroke="#FFB62E" stroke-width="0.7" opacity="0.18"/>
  <!-- side rivets -->
  <circle cx="-138" cy="15" r="3" fill="#3A424A" stroke="#0E1012" stroke-width="1"/><circle cx="-138" cy="15" r="1.3" fill="#7A8695"/>
  <circle cx="138" cy="15" r="3" fill="#3A424A" stroke="#0E1012" stroke-width="1"/><circle cx="138" cy="15" r="1.3" fill="#7A8695"/>
  <!-- small gem -->
  <circle cx="-118" cy="15" r="4.2" fill="#FF6B2B" stroke="#2A0E08" stroke-width="1">
    <animate attributeName="opacity" values="1;0.65;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="-118" cy="15" r="1.8" fill="#FFF2A8" opacity="0.85"/>
  <text x="8" y="19.2" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" fill="#E8E0C8" letter-spacing="0.7">v4.1.2  ·  1451 commits  ·  GPL-3.0</text>
</g>

<!-- subtle dust motes -->
<g opacity="0.35">
  <circle cx="340" cy="142" r="1.2" fill="#FFD23F" opacity="0.7"><animate attributeName="cy" values="142;138;142" dur="3.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0;0.7" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="152" r="1" fill="#FFD23F" opacity="0.6"><animate attributeName="cy" values="152;148;152" dur="4.2s" repeatCount="indefinite" begin="1s"/><animate attributeName="opacity" values="0.6;0;0.6" dur="4.2s" repeatCount="indefinite" begin="1s"/></circle>
  <circle cx="580" cy="148" r="0.9" fill="#FFD23F" opacity="0.5"><animate attributeName="cy" values="148;144;148" dur="3.2s" repeatCount="indefinite" begin="0.6s"/></circle>
</g>
</svg>
